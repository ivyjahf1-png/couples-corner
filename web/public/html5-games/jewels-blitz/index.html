<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jewels Blitz — Couples Corner</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; text-align: center; background: #0F172A; color: #f8fafc;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 18px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .stat { font-size: 12px; color: #94a3b8; } .stat b { color: #FF5722; font-size: 14px; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; max-width: 360px; width: 100%; }
  .cell { aspect-ratio: 1; border-radius: 10px; background: #1e293b; border: 1px solid #334155;
    display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
    transition: transform .08s ease, box-shadow .15s ease; }
  .cell:active { transform: scale(.9); }
  .cell.picked { box-shadow: 0 0 0 2px #FF5722; }
  button { padding: 8px 16px; border-radius: 999px; border: 1px solid #FF5722; cursor: pointer;
    background: rgba(255,87,34,.15); color: #ffd9cc; font-weight: 700; font-size: 13px;
    transition: transform .08s ease, background .15s ease; }
  button:active { transform: scale(.95); }
  button:hover { background: rgba(255,87,34,.3); }
  #msg { font-size: 13px; font-weight: 700; min-height: 18px; }
  #msg.win { color: #4ade80; }
</style>
</head>
<body>
  <h1>💎 Jewels Blitz</h1>
  <div class="row">
    <span class="stat">Moves <b id="moves">25</b></span>
    <span class="stat">Score <b id="score">0</b></span>
    <button id="reset">New game</button>
  </div>
  <div id="board"></div>
  <div id="msg">Tap two neighbouring jewels to swap — line up 3 in a row.</div>
<script>
(function () {
  "use strict";
  var COLS = 8, ROWS = 8, START_MOVES = 25;
  var JEWELS = ["💎", "🔶", "💚", "💙", "❤️", "🟣"];
  var boardEl = document.getElementById("board");
  var grid = [];       /* flat array of jewel strings, length ROWS*COLS */
  var picked = -1;     /* index of the first tapped cell, or -1 */
  var moves = START_MOVES, score = 0, busy = false, over = false;

  function idx(r, c) { return r * COLS + c; }
  function setMsg(t, cls) { var m = document.getElementById("msg"); m.textContent = t; m.className = cls || ""; }
  function stats() {
    document.getElementById("moves").textContent = moves;
    document.getElementById("score").textContent = score;
  }

  /* A stable fill: guarantee the initial board has no pre-made matches so the
     player always has to make the first move themselves. */
  function randAvoid(r, c) {
    var j;
    do { j = JEWELS[Math.floor(Math.random() * JEWELS.length)]; }
    while (
      (c >= 2 && grid[idx(r, c - 1)] === j && grid[idx(r, c - 2)] === j) ||
      (r >= 2 && grid[idx(r - 1, c)] === j && grid[idx(r - 2, c)] === j)
    );
    return j;
  }
  function fill() {
    grid = [];
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        grid[idx(r, c)] = randAvoid(r, c);
  }

  function render() {
    boardEl.innerHTML = "";
    for (var i = 0; i < grid.length; i++) {
      var el = document.createElement("div");
      el.className = "cell" + (i === picked ? " picked" : "");
      el.textContent = grid[i];
      (function (index) { el.addEventListener("click", function () { tap(index); }); })(i);
      boardEl.appendChild(el);
    }
  }

  /* All horizontal + vertical runs of 3+. Returns a Set of matched indices. */
  function findMatches() {
    var matched = {};
    function add(i) { matched[i] = true; }
    var r, c, j, run, start;
    for (r = 0; r < ROWS; r++) {
      c = 0;
      while (c < COLS) {
        j = grid[idx(r, c)]; run = 1;
        while (c + run < COLS && grid[idx(r, c + run)] === j) run++;
        if (run >= 3) for (var k = 0; k < run; k++) add(idx(r, c + k));
        c += run;
      }
    }
    for (c = 0; c < COLS; c++) {
      r = 0;
      while (r < ROWS) {
        j = grid[idx(r, c)]; run = 1;
        while (r + run < ROWS && grid[idx(r + run, c)] === j) run++;
        if (run >= 3) for (var k = 0; k < run; k++) add(idx(r + k, c));
        r += run;
      }
    }
    return matched;
  }

  /* Collapse matched cells: drop jewels down, then refill the top. */
  function collapse(matched) {
    var count = 0;
    for (var c = 0; c < COLS; c++) {
      var write = ROWS - 1;
      for (var r = ROWS - 1; r >= 0; r--) {
        if (!matched[idx(r, c)]) { grid[idx(write, c)] = grid[idx(r, c)]; write--; }
      }
      for (var r = write; r >= 0; r--) {
        grid[idx(r, c)] = JEWELS[Math.floor(Math.random() * JEWELS.length)];
        count++;
      }
    }
    return count;
  }

  /* Resolve cascades until the board is stable, scoring 10 per jewel. */
  function resolveCascades(cb) {
    var matched = findMatches();
    var keys = Object.keys(matched);
    if (keys.length === 0) { cb(); return; }
    score += keys.length * 10;
    stats();
    setMsg("Blitz! +" + (keys.length * 10));
    collapse(matched);
    render();
    setTimeout(function () { resolveCascades(cb); }, 160);
  }

  function finishMove() {
    moves--;
    stats();
    resolveCascades(function () {
      busy = false;
      if (!hasAnyMove()) { over = true; setMsg("No swaps left — press New game.", "win"); }
      else if (moves <= 0) { over = true; setMsg("Out of moves! Final score " + score + ".", "win"); }
      else { setMsg("Tap two neighbouring jewels to swap."); }
    });
  }

  function swap(a, b) {
    var t = grid[a]; grid[a] = grid[b]; grid[b] = t;
  }

  function tap(i) {
    if (busy || over) return;
    if (picked === -1) { picked = i; render(); return; }
    if (picked === i) { picked = -1; render(); return; }
    var pr = Math.floor(picked / COLS), pc = picked % COLS;
    var r = Math.floor(i / COLS), c = i % COLS;
    var adjacent = (Math.abs(pr - r) + Math.abs(pc - c)) === 1;
    if (!adjacent) { picked = i; render(); return; }

    var first = picked;
    picked = -1;
    busy = true;
    swap(first, i);
    render();

    /* Only commit the swap if it produced a match; otherwise bounce it back. */
    if (Object.keys(findMatches()).length === 0) {
      swap(first, i);
      render();
      busy = false;
      setMsg("That swap makes no line — try again.");
      return;
    }
    finishMove();
  }

  /* Is there ANY move left? Brute-force every neighbour swap — cheap at 8x8. */
  function hasAnyMove() {
    function test(a, b) {
      swap(a, b);
      var ok = Object.keys(findMatches()).length > 0;
      swap(a, b);
      return ok;
    }
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++) {
        if (c + 1 < COLS && test(idx(r, c), idx(r, c + 1))) return true;
        if (r + 1 < ROWS && test(idx(r, c), idx(r + 1, c))) return true;
      }
    return false;
  }

  function reset() {
    moves = START_MOVES; score = 0; picked = -1; busy = false; over = false;
    do { fill(); } while (Object.keys(findMatches()).length > 0 || !hasAnyMove());
    stats(); render();
    setMsg("Tap two neighbouring jewels to swap — line up 3 in a row.");
  }

  document.getElementById("reset").addEventListener("click", function () {
    if (busy) return;
    reset();
  });
  reset();
})();
</script>
</body>
</html>
