<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tile Match — Couples Corner</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px;
    background: #0F172A; color: #f8fafc; text-align: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 18px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .stat { font-size: 12px; color: #94a3b8; } .stat b { color: #FF5722; font-size: 14px; }
  #board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 340px; width: 100%; }
  .tile { aspect-ratio: 1; border-radius: 10px; background: #1e293b; border: 1px solid #334155;
    display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer;
    transition: transform .08s ease, box-shadow .15s ease, opacity .15s ease; }
  .tile:active { transform: scale(.94); }
  .tile.picked { box-shadow: 0 0 0 2px #FF5722; }
  .tile.matched { opacity: .18; pointer-events: none; }
  #slot { display: flex; gap: 8px; min-height: 54px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #slot .tile { cursor: default; width: 46px; }
  button { padding: 8px 16px; border-radius: 999px; border: 1px solid #FF5722; cursor: pointer;
    background: rgba(255,87,34,.15); color: #ffd9cc; font-weight: 700; font-size: 13px; }
  button:hover { background: rgba(255,87,34,.3); }
  #msg { font-size: 13px; font-weight: 700; min-height: 18px; }
</style>
</head>
<body>
  <h1>🧩 Tile Match</h1>
  <div class="row">
    <span class="stat">Left <b id="left">18</b></span>
    <span class="stat">Collected <b id="done">0</b></span>
    <button id="reset">New game</button>
  </div>
  <div id="slot"></div>
  <div id="board"></div>
  <div id="msg">Tap tiles into the bar — line up 3 of a kind to clear.</div>
<script>
(function () {
  "use strict";
  var SYMBOLS = ["🌸","🌊","🔥","🍀","🌙","⭐"];
  var PAIRS = 3, SLOTS = 7;
  var tiles, slot, left, done;
  function setMsg(t, cls) { var m = document.getElementById("msg"); m.textContent = t; m.className = cls || ""; }
  function stats() { document.getElementById("left").textContent = left; document.getElementById("done").textContent = done; }
  function makeTiles() {
    var arr = [];
    SYMBOLS.forEach(function (s) { for (var i = 0; i < PAIRS; i++) arr.push(s); });
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr.map(function (s) { return { s: s, state: "board" }; });
  }
  function render() {
    var board = document.getElementById("board"); board.innerHTML = "";
    tiles.forEach(function (t, i) {
      if (t.state !== "board") return;
      var el = document.createElement("div"); el.className = "tile"; el.textContent = t.s;
      el.addEventListener("click", function () { pick(i); });
      board.appendChild(el);
    });
    var slotEl = document.getElementById("slot"); slotEl.innerHTML = "";
    slot.forEach(function (s) {
      var el = document.createElement("div"); el.className = "tile"; el.textContent = s;
      slotEl.appendChild(el);
    });
  }
  function pick(i) {
    var t = tiles[i]; if (t.state !== "board") return;
    if (slot.length >= SLOTS) { setMsg("Bar is full! Match three to clear it.", "lose"); return; }
    t.state = "slot"; slot.push(t.s);
    checkMatch(); render(); stats();
    if (slot.length >= SLOTS) { setMsg("Bar full — no more room. Game over.", "lose"); }
  }
  function checkMatch() {
    var counts = {};
    slot.forEach(function (s) { counts[s] = (counts[s] || 0) + 1; });
    for (var s in counts) {
      if (counts[s] >= PAIRS) {
        var removed = 0;
        slot = slot.filter(function (x) { if (x === s && removed < PAIRS) { removed++; return false; } return true; });
        tiles.forEach(function (t) { if (t.s === s && t.state === "slot" && removed > 0 && !t._counted) { t.state = "matched"; t._counted = true; left--; done++; } });
        setMsg("Cleared 3 " + s + "!");
      }
    }
    if (left === 0) setMsg("🎉 Board cleared — you matched them all!", "win");
  }
  function reset() { tiles = makeTiles(); slot = []; left = tiles.length; done = 0; stats(); render(); setMsg("Tap tiles into the bar — line up 3 of a kind."); }
  document.getElementById("reset").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>
