<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spin Wheel — Couples Corner</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; text-align: center; background: #0F172A; color: #f8fafc;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 18px; font-weight: 700; }
  canvas { touch-action: manipulation; max-width: 100%; height: auto; }
  button { padding: 10px 22px; border-radius: 999px; border: 1px solid #FF5722; cursor: pointer;
    background: rgba(255,87,34,.2); color: #ffd9cc; font-weight: 700; font-size: 14px;
    transition: transform .08s ease, background .15s ease; }
  button:active { transform: scale(.95); }
  button:hover { background: rgba(255,87,34,.35); }
  button:disabled { opacity: .5; cursor: default; }
  #msg { font-size: 14px; font-weight: 700; min-height: 20px; } #msg.win { color: #4ade80; }
</style>
</head>
<body>
  <h1>🎡 Spin Wheel</h1>
  <canvas id="wheel" width="300" height="300" aria-label="Spin wheel"></canvas>
  <button id="spin">Spin</button>
  <div id="msg">Give it a whirl to reveal a fortune.</div>
<script>
(function () {
  "use strict";
  var SEG = [50, 100, 5, 250, 20, 500, 10, "JACKPOT"];
  var COLORS = ["#FF5722", "#1e293b", "#FF5722", "#1e293b", "#FF5722", "#1e293b", "#FF5722", "#1e293b"];
  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var size = canvas.clientWidth || 300;
  canvas.width = size * dpr; canvas.height = size * dpr; ctx.scale(dpr, dpr);
  var R = size / 2, arc = (Math.PI * 2) / SEG.length;
  var angle = 0, spinning = false;

  function draw() {
    ctx.clearRect(0, 0, size, size);
    ctx.save(); ctx.translate(R, R); ctx.rotate(angle);
    for (var i = 0; i < SEG.length; i++) {
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, R - 6, i * arc, (i + 1) * arc); ctx.closePath();
      ctx.fillStyle = COLORS[i]; ctx.fill();
      ctx.save(); ctx.rotate(i * arc + arc / 2);
      ctx.fillStyle = i % 2 ? "#f8fafc" : "#f8fafc"; ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(String(SEG[i]), R - 18, 0); ctx.restore();
    }
    ctx.restore();
    /* Hub + pointer at top. */
    ctx.beginPath(); ctx.fillStyle = "#0b1220"; ctx.arc(R, R, 12, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = "#FF5722"; ctx.moveTo(R, 4); ctx.lineTo(R - 9, 22); ctx.lineTo(R + 9, 22); ctx.closePath(); ctx.fill();
  }
  function spin() {
    if (spinning) return;
    spinning = true; document.getElementById("spin").disabled = true;
    setMsg("Spinning…", "");
    var spins = 4 + Math.random() * 3, target = spins * Math.PI * 2 + Math.random() * Math.PI * 2;
    var start = angle, dur = 3200, t0 = performance.now();
    function frame(t) {
      var p = Math.min((t - t0) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      angle = start + target * eased;
      draw();
      if (p < 1) requestAnimationFrame(frame);
      else {
        spinning = false; document.getElementById("spin").disabled = false;
        var norm = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        var idx = Math.floor(norm / arc) % SEG.length;
        var landed = SEG[(SEG.length - idx) % SEG.length];
        setMsg("🎉 You landed on " + landed + "!", "win");
      }
    }
    requestAnimationFrame(frame);
  }
  function setMsg(t, cls) { var m = document.getElementById("msg"); m.textContent = t; m.className = cls || ""; }
  document.getElementById("spin").addEventListener("click", spin);
  draw();
})();
</script>
</body>
</html>
