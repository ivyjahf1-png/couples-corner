<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Whot! — Couples Corner</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px;
    background: #0F172A; color: #f8fafc; text-align: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 18px; font-weight: 700; }
  .info { font-size: 12px; color: #94a3b8; } .info b { color: #FF5722; }
  .pile { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 70px; }
  .card { width: 54px; height: 76px; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; font-weight: 800; cursor: pointer;
    background: #f8fafc; color: #0F172A; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    transition: transform .08s ease, box-shadow .15s ease; }
  .card:active { transform: translateY(2px); }
  .card .num { font-size: 20px; line-height: 1; }
  .card .suit { font-size: 18px; }
  .card.playable { box-shadow: 0 0 0 2px #FF5722, 0 2px 8px rgba(255,87,34,.5); }
  .card.dim { opacity: .45; }
  .card.top { background: #1e293b; color: #f8fafc; border: 1px solid #334155; cursor: default; }
  .card.deck { background: #0b1220; color: #FF5722; border: 2px dashed #FF5722; }
  button { padding: 8px 16px; border-radius: 999px; border: 1px solid #FF5722; cursor: pointer;
    background: rgba(255,87,34,.15); color: #ffd9cc; font-weight: 700; font-size: 13px; }
  button:hover { background: rgba(255,87,34,.3); }
  #msg { font-size: 13px; font-weight: 700; min-height: 18px; } #msg.win { color: #4ade80; } #msg.lose { color: #f87171; }
</style>
</head>
<body>
  <h1>🃏 Whot! Battle</h1>
  <div class="info">Market <b id="mkt">?</b> · Match the suit or number, or play a Whot (20).</div>
  <div class="pile" id="top"></div>
  <div class="pile" id="hand"></div>
  <div class="row" style="display:flex;gap:10px;align-items:center;">
    <button id="draw">Draw card</button>
    <button id="newgame">New game</button>
  </div>
  <div id="msg">Play a highlighted card to clear your hand first.</div>
<script>
(function () {
  "use strict";
  var SUITS = [ { s: "circle", g: "🔵" }, { s: "triangle", g: "🔺" }, { s: "cross", g: "❌" }, { s: "square", g: "🟦" }, { s: "star", g: "⭐" } ];
  function makeDeck() {
    var deck = [];
    for (var si = 0; si < SUITS.length; si++) for (var n = 1; n <= 14; n++) deck.push({ n: n, g: SUITS[si].g, s: SUITS[si].s });
    for (var w = 0; w < 5; w++) deck.push({ n: 20, g: "🌟", s: "whot" });
    for (var i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    return deck;
  }
  var deck, hand, rival, top, turn, over;
  function setMsg(text, cls) { var m = document.getElementById("msg"); m.textContent = text; m.className = cls || ""; }
  function canPlay(c) {
    if (top.s === "whot") return true;
    return c.s === "whot" || c.s === top.s || c.n === top.n;
  }
  function render() {
    var topEl = document.getElementById("top"); topEl.innerHTML = "";
    var tc = document.createElement("div"); tc.className = "card top";
    tc.innerHTML = '<span class="num">' + top.n + '</span><span class="suit">' + top.g + '</span>';
    topEl.appendChild(tc);
    document.getElementById("mkt").textContent = top.s === "whot" ? "Whot" : top.g + " " + top.n;
    var handEl = document.getElementById("hand"); handEl.innerHTML = "";
    hand.forEach(function (c, i) {
      var el = document.createElement("div");
      var playable = turn === "you" && !over && canPlay(c);
      el.className = "card" + (playable ? " playable" : (turn === "you" && !over ? " dim" : ""));
      el.innerHTML = '<span class="num">' + c.n + '</span><span class="suit">' + c.g + '</span>';
      if (playable) el.addEventListener("click", function () { play(i); });
      handEl.appendChild(el);
    });
  }
  function play(i) {
    var c = hand[i];
    hand.splice(i, 1); top = c; turn = "rival";
    render();
    if (hand.length === 0) { over = true; setMsg("🎉 You cleared your hand — you win!", "win"); return; }
    setMsg("Rival is thinking…");
    setTimeout(rivalTurn, 600);
  }
  function rivalTurn() {
    if (over) return;
    var idx = -1;
    for (var i = 0; i < rival.length; i++) if (canPlay(rival[i])) { idx = i; break; }
    if (idx >= 0) {
      top = rival.splice(idx, 1)[0]; turn = "you"; render();
      if (rival.length === 0) { over = true; setMsg("😤 Your rival cleared their hand first.", "lose"); return; }
      setMsg("Your turn — play a highlighted card.");
    } else if (deck.length) {
      rival.push(deck.pop()); rivalTurn();
    } else { turn = "you"; render(); setMsg("Rival is stuck — your turn!"); }
  }
  function draw() {
    if (over || turn !== "you") return;
    if (deck.length) { hand.push(deck.pop()); render(); setMsg("Drew a card. Play a highlighted card."); }
    else { turn = "rival"; render(); rivalTurn(); }
  }
  function newGame() {
    deck = makeDeck(); hand = []; rival = [];
    for (var i = 0; i < 5; i++) { hand.push(deck.pop()); rival.push(deck.pop()); }
    top = deck.pop(); turn = "you"; over = false;
    render(); setMsg("Your turn — play a highlighted card.");
  }
  document.getElementById("draw").addEventListener("click", draw);
  document.getElementById("newgame").addEventListener("click", newGame);
  newGame();
})();
</script>
</body>
</html>
