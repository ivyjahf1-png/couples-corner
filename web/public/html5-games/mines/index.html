<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mines — Couples Corner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B1120; --panel: #0F172A; --tile-a: #131C33; --tile-b: #0E1526;
    --line: rgba(148, 163, 184, .14);
    --orange: #FF7A00; --cyan: #22D3EE; --green: #34D399; --red: #F43F5E;
    --text: #E2E8F0; --dim: #94A3B8;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #16213E 0%, var(--bg) 55%);
    color: var(--text);
    font: 600 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
  h1 { font-size: 18px; letter-spacing: .28em; background: linear-gradient(90deg, var(--orange), #FFB37A);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wallet { display: flex; gap: 6px; align-items: center; background: rgba(255,122,0,.12);
            border: 1px solid rgba(255,122,0,.45); color: #FFD9B3; padding: 6px 12px;
            border-radius: 999px; font-variant-numeric: tabular-nums; }
  main { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 20px;
         max-width: 520px; width: 100%; margin: 0 auto; }
  .stage { position: relative; background: linear-gradient(180deg, #101A33, #0C1322);
           border: 1px solid var(--line); border-radius: 18px; padding: 14px;
           box-shadow: 0 18px 40px -22px rgba(0,0,0,.8); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .tile { position: relative; aspect-ratio: 1; border: 1px solid rgba(34,211,238,.16);
          border-radius: 12px; background: linear-gradient(160deg, var(--tile-a), var(--tile-b));
          cursor: pointer; transition: transform .12s, border-color .15s, box-shadow .15s;
          font-size: clamp(18px, 6vw, 30px); display: flex; align-items: center; justify-content: center;
          user-select: none; color: transparent; }
  .tile:not(.revealed):hover { transform: translateY(-2px); border-color: rgba(255,122,0,.85);
          box-shadow: 0 0 14px rgba(255,122,0,.35); }
  .tile:not(.revealed):active { transform: scale(.96); }
  .tile.revealed { cursor: default; animation: pop .28s ease; color: inherit; }
  .tile.gem { border-color: rgba(34,211,238,.9);
              box-shadow: 0 0 16px rgba(34,211,238,.45), inset 0 0 18px rgba(34,211,238,.12);
              background: linear-gradient(160deg, #0E2A33, #0B1A24); }
  .tile.bomb { border-color: rgba(244,63,94,.95);
               box-shadow: 0 0 18px rgba(244,63,94,.55);
               background: linear-gradient(160deg, #2A101B, #1A0A12); animation: shake .4s ease; }
  .tile.bomb::after { content: ""; position: absolute; inset: 0; border-radius: 12px;
                      animation: boom .6s ease-out; }
  .tile.winner { border-color: rgba(52,211,153,.7); box-shadow: 0 0 12px rgba(52,211,153,.3); }
  @keyframes pop { 0% { transform: scale(.55); opacity: .35; } 60% { transform: scale(1.12); }
                   100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px) rotate(-3deg); }
                     40% { transform: translateX(5px) rotate(3deg); } 60% { transform: translateX(-4px); }
                     80% { transform: translateX(4px); } }
  @keyframes boom { 0% { box-shadow: 0 0 0 0 rgba(244,63,94,.55); }
                    100% { box-shadow: 0 0 0 26px rgba(244,63,94,0); } }
  .result { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 6px; background: rgba(5,9,18,.84);
            backdrop-filter: blur(6px); border-radius: 18px; text-align: center; padding: 16px; }
  .result h2 { font-size: 26px; letter-spacing: .06em; }
  .result.win h2 { color: var(--green); } .result.lose h2 { color: var(--red); }
  .result p { color: var(--dim); font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>MINES</h1>
  <div class="wallet">🪙 <span id="balance">—</span></div>
</header>

<main>
  <section class="stage" aria-label="Mines board">
    <div class="grid" id="grid"></div>
    <div class="result hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultSub"></p>
    </div>
  </section>

  <section class="panel" aria-label="Bet controls">
    <div class="ctl">
      <label for="bet">Bet <span>coins</span></label>
      <div class="stepper">
        <button type="button" id="betDown" aria-label="Decrease bet">−</button>
        <input id="bet" type="number" min="1" step="1" value="10" inputmode="numeric" />
        <button type="button" id="betUp" aria-label="Increase bet">+</button>
      </div>
    </div>

    <div class="ctl">
      <label for="mines">Mines <span id="minesVal">3</span></label>
      <input id="mines" type="range" min="1" max="24" step="1" value="3" />
    </div>

    <div class="stats">
      <div><span>Multiplier</span><strong id="mult">—</strong></div>
      <div><span>Payout</span><strong id="payout">—</strong></div>
    </div>

    <button type="button" class="primary" id="action">Start Game</button>
    <button type="button" class="cash hidden" id="cashout">Cash Out 🪙 <span id="cashAmt">0</span></button>
  </section>
</main>

<div class="toast hidden" id="toast" role="status"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * MINES — Stake-style. 25 tiles, configurable mines, live multiplier,
 * gem/bomb reveals with audio + haptics, and a Cash Out that credits
 * the member's Supabase wallet through the parent GameRunner bridge.
 * ------------------------------------------------------------------ */
const TILES = 25;
const EDGE = 0.99;              /* 1% house edge on the fair odds */
const $ = (id) => document.getElementById(id);

const gridEl = $("grid"), actionEl = $("action"), cashEl = $("cashout"),
      betEl = $("bet"), minesEl = $("mines"), minesValEl = $("minesVal"),
      multEl = $("mult"), payoutEl = $("payout"), cashAmtEl = $("cashAmt"),
      balanceEl = $("balance"), resultEl = $("result"),
      resultTitleEl = $("resultTitle"), resultSubEl = $("resultSub"),
      toastEl = $("toast");

let state = "idle";             /* idle | playing | over */
let bombs = new Set();          /* tile indexes holding bombs */
let picks = 0;                  /* safe tiles revealed this round */
let cashed = false;             /* round already paid out */
let balance = Number(localStorage.getItem("cc_mines_balance") || 1000);
let toastTimer = 0;

/* --- AUDIO + HAPTICS ------------------------------------------------ */
let audioCtx = null;
function tone(freq, dur, type, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain); gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur);
  } catch (e) { /* audio blocked until a gesture — silent is fine */ }
}
function chime()  { tone(880, .12, "sine", .07); setTimeout(() => tone(1319, .18, "sine", .07), 70); }
function boom()   { tone(110, .5, "sawtooth", .12); setTimeout(() => tone(72, .6, "square", .08), 40); }
function clickFx(){ tone(520, .05, "triangle", .05); }
function haptic(p){ try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

function toast(msg, ms) {
  toastEl.textContent = msg;
  toastEl.classList.remove("hidden");
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove("show");
    setTimeout(() => toastEl.classList.add("hidden"), 260);
  }, ms || 2200);
}

function renderBalance() { balanceEl.textContent = Math.max(0, Math.floor(balance)).toLocaleString(); }

/* --- MULTIPLIER MATH ------------------------------------------------ *
 * Fair payout for `n` consecutive safe tiles on a 25-tile board with M
 * mines: the product of the conditional odds of surviving each pick,
 * then the 1% edge is applied. 3 mines → first pick 1.13x, grows to
 * 1.45x / 2.10x and beyond as the streak continues.                  */
function multiplier(n) {
  const M = Number(minesEl.value);
  if (n <= 0) return 0;
  let m = 1;
  for (let i = 0; i < n; i++) m *= (TILES - i) / (TILES - M - i);
  return m * EDGE;
}
function currentBet() {
  const v = Math.floor(Number(betEl.value));
  return Number.isFinite(v) && v > 0 ? v : 1;
}
function refreshStats() {
  const shown = Math.max(picks, state === "playing" ? 1 : 0);
  if (shown === 0) { multEl.textContent = "—"; payoutEl.textContent = "—"; cashAmtEl.textContent = "0"; return; }
  const mult = multiplier(shown);
  const payout = Math.floor(currentBet() * mult);
  multEl.textContent = mult.toFixed(2) + "x";
  payoutEl.textContent = payout.toLocaleString();
  cashAmtEl.textContent = payout.toLocaleString();
}

/* --- BOARD ----------------------------------------------------------- */
function buildBoard() {
  gridEl.innerHTML = "";
  for (let i = 0; i < TILES; i++) {
    const t = document.createElement("button");
    t.type = "button";
    t.className = "tile";
    t.dataset.i = String(i);
    t.setAttribute("aria-label", "Hidden tile " + (i + 1));
    t.addEventListener("click", () => pickTile(i));
    gridEl.appendChild(t);
  }
}
const tileAt = (i) => gridEl.children[i];

function layoutBombs() {
  bombs = new Set();
  const M = Math.min(24, Math.max(1, Number(minesEl.value)));
  while (bombs.size < M) bombs.add(Math.floor(Math.random() * TILES));
}

function setBusy(playing) {
  betEl.disabled = playing;
  $("betUp").disabled = playing;
  $("betDown").disabled = playing;
  minesEl.disabled = playing;
}

function startRound() {
  const bet = currentBet();
  if (bet > balance) { toast("Bet exceeds your balance"); return; }
  state = "playing"; picks = 0; cashed = false;
  layoutBombs();
  buildBoard();
  resultEl.classList.add("hidden");
  setBusy(true);
  actionEl.classList.add("hidden");
  cashEl.classList.remove("hidden");
  cashEl.disabled = false;
  clickFx(); haptic(10);
  refreshStats();
}

/* --- REVEALS ---------------------------------------------------------- */
function reveal(i, cls, glyph) {
  const t = tileAt(i);
  t.classList.add("revealed", cls);
  t.textContent = glyph;
  t.disabled = true;
}

function pickTile(i) {
  if (state !== "playing" || tileAt(i).classList.contains("revealed")) return;

  if (bombs.has(i)) {
    /* BOMB — explode, reveal every mine, round over. */
    reveal(i, "bomb", "💣");
    boom(); haptic([60, 40, 80]);
    for (const b of bombs) {
      if (b !== i && !tileAt(b).classList.contains("revealed")) reveal(b, "bomb", "💣");
    }
    endRound(false);
    return;
  }

  /* GEM — safe pick: chime, soft haptic, recompute the live payout. */
  reveal(i, "gem", "💎");
  tileAt(i).classList.add("winner");
  chime(); haptic(12);
  picks++;
  refreshStats();

  if (picks === TILES - bombs.size) {
    /* Every safe tile found — the board is cleared: auto cash out. */
    toast("Board cleared! Auto cash out 🎉", 2600);
    doCashOut();
  }
}

function endRound(won) {
  state = "over";
  setBusy(false);
  cashEl.classList.add("hidden");
  actionEl.classList.remove("hidden");
  actionEl.textContent = "Play Again";
  resultTitleEl.textContent = won ? "CASHED OUT!" : "BOOM!";
  resultSubEl.textContent = won
    ? "Winnings credited to your wallet"
    : "You hit a mine — better luck next round";
  resultEl.classList.remove("hidden");
  resultEl.classList.add(won ? "win" : "lose");
  if (won) resultEl.classList.remove("lose"); else resultEl.classList.remove("win");
  refreshStats();
}

/* --- CASH OUT → SUPABASE (via the parent GameRunner bridge) ----------- *
 * The static frame has no session, so it posts the payout up to the
 * GameRunner, which re-posts to /api/game/cashout WITH the member's own
 * session cookie. The reply carries the fresh wallet balance. When the
 * frame is opened standalone (no runner parent) the credit falls back to
 * the local display so the demo still works.                          */
function doCashOut() {
  if (state !== "playing" || cashed || picks === 0) return;
  const payout = Math.floor(currentBet() * multiplier(picks));
  if (payout <= 0) return;

  cashed = true;
  cashEl.disabled = true;
  chime(); haptic([15, 30, 15]);

  const inRunner = window.parent !== window;
  let replied = false;

  function finishLocal(ok) {
    if (ok) {
      balance += payout;
      localStorage.setItem("cc_mines_balance", String(balance));
      renderBalance();
      endRound(true);
      toast("+" + payout.toLocaleString() + " coins (local demo balance)");
    } else {
      cashed = false;
      cashEl.disabled = false;
      toast("Cash-out failed — try again");
    }
  }

  if (!inRunner) { finishLocal(true); return; }

  function onReply(ev) {
    if (ev.source !== window.parent) return;
    const d = ev.data;
    if (!d || d.type !== "game:cashout") return;
    replied = true;
    window.removeEventListener("message", onReply);
    clearTimeout(timer);
    if (d.ok) {
      if (typeof d.coinBalance === "number") {
        balance = d.coinBalance;
        localStorage.setItem("cc_mines_balance", String(balance));
        renderBalance();
      }
      endRound(true);
      toast("+" + payout.toLocaleString() + " coins credited 🪙");
    } else {
      cashed = false;
      cashEl.disabled = false;
      toast(d.error || "Cash-out failed — try again");
    }
  }
  window.addEventListener("message", onReply);
  window.parent.postMessage({ type: "game:cashout", coins: payout }, "*");

  /* No reply within 3s (older runner): fall back to the local credit. */
  const timer = setTimeout(() => {
    if (replied) return;
    window.removeEventListener("message", onReply);
    finishLocal(true);
  }, 3000);
}

/* --- CONTROLS --------------------------------------------------------- */
actionEl.addEventListener("click", () => {
  if (state === "playing") return;
  resultEl.classList.add("hidden");
  startRound();
});
cashEl.addEventListener("click", doCashOut);

$("betUp").addEventListener("click", () => {
  betEl.value = String(currentBet() + 10); clickFx(); refreshStats();
});
$("betDown").addEventListener("click", () => {
  betEl.value = String(Math.max(1, currentBet() - 10)); clickFx(); refreshStats();
});
betEl.addEventListener("change", refreshStats);
betEl.addEventListener("input", refreshStats);
minesEl.addEventListener("input", () => {
  minesValEl.textContent = minesEl.value;
  if (state !== "playing") refreshStats();
});

/* --- WALLET BRIDGE ---------------------------------------------------- *
 * Ask the parent runner for the real server balance on load, and keep
 * the display in sync with any later push.                             */
window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const d = ev.data;
  if (d && d.type === "game:wallet" && typeof d.coinBalance === "number") {
    balance = d.coinBalance;
    localStorage.setItem("cc_mines_balance", String(balance));
    renderBalance();
  }
});

buildBoard();
renderBalance();
refreshStats();
if (window.parent !== window) window.parent.postMessage({ type: "game:ready" }, "*");
</script>
</body>
</html>
