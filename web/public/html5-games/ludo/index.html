<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ludo — Couples Corner</title>
<!--
  HTML5 BUILD SLOT — served at /html5-games/ludo/index.html, which is exactly the
  path the launcher registry (web/lib/game/registry.ts) hands to the iframe.
  Drop the real build's files into public/html5-games/ludo/ (replacing this
  placeholder) and the GameModal picks it up with zero code changes: the URL is
  minted server-side from the registry, never from the client.

  This placeholder exists so the iframe never shows a raw 404 before the real
  build ships — the same "build in progress, never a 404" product decision the
  removed player documented. It is intentionally dependency-free: no CDN, no
  fonts, no JS, so it renders instantly inside the sandboxed frame.

  The launcher mints the URL with a signed `?cc_token=<uid>|<gameId>|<exp>.<hmac>`
  query param. A real build can read it from `location.search` and POST it back
  to a game API to prove who launched the session; it is short-lived (60 min).
-->
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: #080b18; color: #f8fafc;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .glyph { font-size: 64px; line-height: 1; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
  h1 { font-size: 20px; font-weight: 700; }
  p { font-size: 13px; color: #a5a5b8; max-width: 34ch; line-height: 1.55; }
  .tag {
    margin-top: 4px; padding: 6px 14px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: #fcd34d;
    border: 1px solid rgba(252, 211, 77, .3); background: rgba(252, 211, 77, .08);
  }
</style>
</head>
<body>
  <div class="glyph" aria-hidden="true">🎲</div>
  <h1>Ludo</h1>
  <p>The Ludo build is being prepared. Your game session is ready — the board
     loads here the moment it ships.</p>
  <span class="tag">Coming soon</span>
</body>
</html>
